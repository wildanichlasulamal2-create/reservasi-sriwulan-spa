<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reservasi Admin | SIRES Sriwulan Spa</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="form-container">


<h1>
Data Reservasi
</h1>


<p>
Daftar reservasi pelanggan masuk
</p>


<div id="dataBooking"></div>


</div>



<script>


let data = JSON.parse(localStorage.getItem("reservasi"));


if(data){


document.getElementById("dataBooking").innerHTML = `


<div class="card">


<h2>
${data.booking}
</h2>


<p>
<b>Nama Pelanggan</b>
<br>
${data.nama}
</p>


<p>
<b>Treatment</b>
<br>
${data.treatment}
</p>


<p>
<b>Harga</b>
<br>
${data.harga}
</p>


<p>
<b>Tanggal</b>
<br>
${data.tanggal}
</p>


<p>
<b>Jam</b>
<br>
${data.jam}
</p>


<p>
<b>Terapis</b>
<br>
${data.terapis}
</p>


<p>
<b>Status</b>
<br>
🟡 ${data.status}
</p>


<button onclick="konfirmasi()">
Konfirmasi
</button>


</div>


`;


}else{


document.getElementById("dataBooking").innerHTML = `

<p>
Belum ada reservasi masuk
</p>

`;

}



function konfirmasi(){

alert("Reservasi berhasil dikonfirmasi");

}
