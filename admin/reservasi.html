<script>

let data = JSON.parse(localStorage.getItem("reservasi")) || [];

// Jika data lama masih berupa object, ubah menjadi array
if (!Array.isArray(data)) {
    data = [data];
}

tampilData();

function tampilData() {

    if (data.length === 0) {

        document.getElementById("dataBooking").innerHTML = `
            <p>Belum ada reservasi masuk.</p>
        `;
        return;
    }

    let html = `
    <table class="table-admin">
        <tr>
            <th>No Booking</th>
            <th>Nama</th>
            <th>Treatment</th>
            <th>Tanggal</th>
            <th>Jam</th>
            <th>Status</th>
            <th>Aksi</th>
        </tr>
    `;

    data.forEach((item, index) => {

        html += `
        <tr>

            <td>${item.booking}</td>

            <td>${item.nama}</td>

            <td>${item.treatment}</td>

            <td>${item.tanggal}</td>

            <td>${item.jam}</td>

            <td>${item.status}</td>

            <td>

                <button onclick="terima(${index})">
                ✔
                </button>

                <button onclick="tolak(${index})">
                ✖
                </button>

            </td>

        </tr>
        `;

    });

    html += "</table>";

    document.getElementById("dataBooking").innerHTML = html;

}

function terima(index){

    data[index].status = "🟢 Diterima";

    localStorage.setItem("reservasi", JSON.stringify(data));

    tampilData();

}

function tolak(index){

    data[index].status = "🔴 Ditolak";

    localStorage.setItem("reservasi", JSON.stringify(data));

    tampilData();

}

</script>
