<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Reservasi | SIRES Sriwulan Spa</title>

<link rel="stylesheet" href="../css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="form-container">


<h1>📋 Dashboard Reservasi</h1>

<p>Kelola seluruh reservasi pelanggan Sriwulan Spa</p>



<div class="search-box">


<select id="filterStatus" onchange="filterStatus()">

<option value="">Semua Status</option>

<option value="Menunggu">🟡 Menunggu</option>

<option value="Dikonfirmasi">🟢 Dikonfirmasi</option>

<option value="Selesai">✅ Selesai</option>

</select>



<input 
type="text"
id="cariBooking"
placeholder="🔍 Cari Nomor Booking atau Nama..."
onkeyup="cariReservasi()">


</div>




<div class="dashboard-admin">


<div class="stat-card">
<h3>Total Reservasi</h3>
<h2 id="totalReservasi">0</h2>
</div>


<div class="stat-card">
<h3>🟡 Menunggu</h3>
<h2 id="menunggu">0</h2>
</div>


<div class="stat-card">
<h3>🟢 Dikonfirmasi</h3>
<h2 id="dikonfirmasi">0</h2>
</div>


<div class="stat-card">
<h3>✅ Selesai</h3>
<h2 id="selesai">0</h2>
</div>


</div>




<div id="dataBooking"></div>





<script>


let reservasi = JSON.parse(
localStorage.getItem("reservasi")
) || [];



if(!Array.isArray(reservasi)){

reservasi=[reservasi];

}






function updateDashboard(){


document.getElementById("totalReservasi").innerHTML =
reservasi.length;


document.getElementById("menunggu").innerHTML =
reservasi.filter(r=>r.status.includes("Menunggu")).length;


document.getElementById("dikonfirmasi").innerHTML =
reservasi.filter(r=>r.status.includes("Dikonfirmasi")).length;


document.getElementById("selesai").innerHTML =
reservasi.filter(r=>r.status.includes("Selesai")).length;


}







function tampilkanData(data){


let html = `


<table class="table-admin">


<tr>

<th>No</th>

<th>No Booking</th>

<th>Nama</th>

<th>No WhatsApp</th>

<th>Treatment</th>

<th>Tanggal</th>

<th>Jam</th>

<th>Terapis</th>

<th>Status</th>

<th>Aksi</th>

</tr>



`;




data.forEach((item,index)=>{


html += `


<tr>


<td>${index+1}</td>


<td>${item.booking}</td>


<td>${item.nama}</td>


<td>${item.wa}</td>


<td>${item.treatment}</td>


<td>${item.tanggal}</td>


<td>${item.jam}</td>


<td>${item.terapis}</td>


<td>${item.status}</td>




<td>



<button onclick="detailReservasi(${index})">

📋 Detail

</button>



<button onclick="konfirmasi(${index})">

🟢 Konfirmasi

</button>



<button onclick="selesai(${index})">

✅ Selesai

</button>



<button onclick="kirimWA(${index})">

📱 Chat WA

</button>



<button class="btn-hapus-kecil" onclick="hapusReservasi(${index})">

🗑️

</button>



</td>


</tr>


`;


});



html += "</table>";



document.getElementById("dataBooking").innerHTML = html;


}








function simpan(){


localStorage.setItem(

"reservasi",

JSON.stringify(reservasi)

);


location.reload();


}








function konfirmasi(index){


reservasi[index].status="🟢 Dikonfirmasi";


simpan();


}





function selesai(index){


reservasi[index].status="✅ Selesai";


simpan();


}







// ========================
// WHATSAPP OTOMATIS
// ========================


function kirimWA(index){


let data = reservasi[index];



let nomor = data.wa.replace(/^0/, "62");



let pesan =


"Halo Kak " + data.nama +

", kami dari Sriwulan Spa 😊\n\n" +


"Detail Reservasi:\n" +

"🔖 Booking : " + data.booking + "\n" +

"💆 Treatment : " + data.treatment + "\n" +

"💰 Harga : " + data.harga + "\n" +

"👩 Terapis : " + data.terapis + "\n" +

"📅 Tanggal : " + data.tanggal + "\n" +

"🕒 Jam : " + data.jam + "\n\n" +

"Terima kasih telah memilih Sriwulan Spa 🌸";



let url =

"https://wa.me/" +

nomor +

"?text=" +

encodeURIComponent(pesan);



window.open(url,"_blank");


}








function hapusReservasi(index){


if(confirm("Yakin ingin menghapus reservasi?")){


reservasi.splice(index,1);


simpan();


}


}








function detailReservasi(index){


let data = reservasi[index];



alert(


"📋 DETAIL RESERVASI\n\n"+

"🔖 Booking : "+data.booking+"\n"+

"👤 Nama : "+data.nama+"\n"+

"📱 WhatsApp : "+data.wa+"\n"+

"💆 Treatment : "+data.treatment+"\n"+

"💰 Harga : "+data.harga+"\n"+

"👩 Terapis : "+data.terapis+"\n"+

"📅 Tanggal : "+data.tanggal+"\n"+

"🕒 Jam : "+data.jam+"\n"+

"📌 Status : "+data.status


);


}








function cariReservasi(){


let keyword =

document.getElementById("cariBooking")
.value
.toLowerCase();




let hasil = reservasi.filter(item =>


item.booking.toLowerCase().includes(keyword)

||

item.nama.toLowerCase().includes(keyword)


);



tampilkanData(hasil);


}








function filterStatus(){


let status =

document.getElementById("filterStatus").value;




if(status==""){


tampilkanData(reservasi);


return;


}




let hasil = reservasi.filter(item =>


item.status.includes(status)


);



tampilkanData(hasil);



}







updateDashboard();

tampilkanData(reservasi);



</script>


</div>


</body>

</html>
