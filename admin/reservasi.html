<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Reservasi | SIRES Sriwulan Spa</title>

<link rel="stylesheet" href="../css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="form-container">


<h1>📋 Dashboard Reservasi</h1>

<p>Kelola seluruh reservasi pelanggan Sriwulan Spa</p>



<div class="search-box">


<select id="filterStatus" onchange="filterStatus()">

<option value="">Semua Status</option>

<option value="Menunggu">🟡 Menunggu</option>

<option value="Dikonfirmasi">🟢 Dikonfirmasi</option>

<option value="Selesai">✅ Selesai</option>

</select>



<input 
type="text"
id="cariBooking"
placeholder="🔍 Cari Nomor Booking atau Nama..."
onkeyup="cariReservasi()">


</div>




<div class="dashboard-admin">


<div class="stat-card">
<h3>Total Reservasi</h3>
<h2 id="totalReservasi">0</h2>
</div>


<div class="stat-card">
<h3>🟡 Menunggu</h3>
<h2 id="menunggu">0</h2>
</div>


<div class="stat-card">
<h3>🟢 Dikonfirmasi</h3>
<h2 id="dikonfirmasi">0</h2>
</div>


<div class="stat-card">
<h3>✅ Selesai</h3>
<h2 id="selesai">0</h2>
</div>


</div>




<div id="dataBooking"></div>


<script type="module" src="../js/admin.js"></script>


</div>


</body>

</html>
