<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reservasi | Sriwulan Spa</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<section class="booking">


<div class="booking-box">


<h1>
Reservasi Online
</h1>


<p>
Silakan isi data reservasi Anda.
</p>



<form id="bookingForm">



<label>
Nama Lengkap
</label>

<input 
type="text" 
id="nama"
placeholder="Masukkan nama lengkap"
required>



<label>
Nomor WhatsApp
</label>

<input 
type="tel" 
id="wa"
placeholder="08xxxxxxxxxx"
required>



<label>
Pilih Treatment
</label>


<select id="treatment" required>


<option value="">
-- Pilih Treatment --
</option>


<option value="Massage Relax" data-harga="150000">
Massage Relax
</option>


<option value="Facial Treatment" data-harga="200000">
Facial Treatment
</option>


<option value="Body Scrub" data-harga="250000">
Body Scrub
</option>


</select>



<label>
Harga
</label>


<input
type="text"
id="harga"
placeholder="Harga otomatis"
readonly>



<label>
Pilih Terapis
</label>


<select id="terapis" required>


<option value="">
-- Pilih Terapis --
</option>


<option value="Dewi">
Dewi
</option>


<option value="Sinta">
Sinta
</option>


<option value="Ayu">
Ayu
</option>


</select>



<label>
Tanggal Reservasi
</label>


<input 
type="date"
id="tanggal"
required>




<label>
Jam Reservasi
</label>


<input 
type="time"
id="jam"
required>

<label>
  No WhatsApp
</label>
  


<button type="submit">

Lanjutkan Reservasi

</button>



</form>


</div>


</section>



<script src="js/booking.js"></script>


</body>


</html>
