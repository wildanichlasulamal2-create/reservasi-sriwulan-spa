<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reservasi | Sriwulan Spa</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<section class="booking">

<div class="booking-box">

<h1>Reservasi Online</h1>

<p>Silakan isi data reservasi Anda.</p>

<form>

<label>Nama Lengkap</label>

<input type="text" placeholder="Masukkan nama">

<label>Nomor WhatsApp</label>

<input type="tel" placeholder="08xxxxxxxxxx">

<label>Pilih Treatment</label>

<select>

<option>Massage Relax</option>

<option>Facial Treatment</option>

<option>Body Scrub</option>

</select>

<label>Pilih Terapis</label>

<select>

<option>Terapis A</option>

<option>Terapis B</option>

<option>Terapis C</option>

</select>

<label>Tanggal Reservasi</label>

<input type="date">

<label>Jam Reservasi</label>

<input type="time">

<button>

Lanjutkan Reservasi

</button>

</form>

</div>

</section>

</body>

</html>
