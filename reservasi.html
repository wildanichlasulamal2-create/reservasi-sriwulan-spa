<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reservasi | Sriwulan Spa</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<section class="booking">

<div class="booking-box">

<h1>Reservasi Online</h1>

<p>Silakan isi data reservasi Anda.</p>

<form id="bookingForm">

<label>Nama Lengkap</label>
<input type="text" id="nama" required>

<label>Nomor WhatsApp</label>
<input type="tel" id="wa" required>

<label>Pilih Treatment</label>

<select id="treatment">

<option value="">-- Pilih Treatment --</option>

<option value="Massage Relax">Massage Relax</option>

<option value="Facial Treatment">Facial Treatment</option>

<option value="Body Scrub">Body Scrub</option>

</select>

<label>Harga</label>

<input
type="text"
id="harga"
readonly>

<label>Pilih Terapis</label>

<select>

<option>Terapis A</option>

<option>Terapis B</option>

<option>Terapis C</option>

</select>

<label>Tanggal</label>

<input type="date" required>

<label>Jam</label>

<input type="time" required>

<button type="submit">

Lanjutkan Reservasi

</button>

</form>

</div>

</section>

</body>

</html>

<script src="js/booking.js"></script>

</body>
