<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reservasi | Sriwulan Spa</title>


<link rel="stylesheet" href="css/style.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


</head>


<body>



<section class="booking">



<div class="booking-box">



<h1>
Reservasi Online
</h1>


<p>
Silakan isi data reservasi Anda.
</p>




<form id="bookingForm">



<label>
Nama Lengkap
</label>


<input 
type="text"
id="nama"
placeholder="Masukkan nama lengkap"
required>



<br>



<label>
Nomor WhatsApp
</label>


<input 
type="tel"
id="noWa"
placeholder="08xxxxxxxxxx"
required>



<br>



<label>
Pilih Treatment
</label>



<select id="treatment" required>


<option value="">
-- Pilih Treatment --
</option>


<option value="Massage Relax">
Massage Relax
</option>


<option value="Facial Treatment">
Facial Treatment
</option>


<option value="Body Scrub">
Body Scrub
</option>


</select>



<br>



<label>
Harga
</label>


<input 
type="text"
id="harga"
placeholder="Harga otomatis"
readonly>



<br>



<label>
Pilih Terapis
</label>


<select id="terapis" required>


<option value="">
-- Pilih Terapis --
</option>


<option value="Dewi">
Dewi
</option>


<option value="Sinta">
Sinta
</option>


<option value="Ayu">
Ayu
</option>


</select>



<br>



<label>
Tanggal Reservasi
</label>


<input 
type="date"
id="tanggal"
required>



<br>



<label>
Jam Reservasi
</label>


<input 
type="time"
id="jam"
required>



<br>



<button type="submit">

Lanjutkan Reservasi

</button>



</form>



</div>



</section>





<script type="module" src="js/booking.js"></script>



</body>


</html>
