<script>

let data = JSON.parse(localStorage.getItem("reservasi")) || [];

// Jika data lama masih object, ubah menjadi array
if (!Array.isArray(data)) {
    data = [data];
}

// Ambil reservasi terakhir
let reservasi = data[data.length - 1];

    console.log("DATA:", data);
console.log("RESERVASI:", reservasi);

    alert(JSON.stringify(reservasi));

if(reservasi){

document.getElementById("hasil").innerHTML = `

<div class="hasil-card">

<h2>✅ Reservasi Berhasil</h2>

<div class="info">
<span>🔖 Nomor Booking</span>
<h3>${reservasi.booking}</h3>
</div>

<div class="info">
<span>👤 Nama Pelanggan</span>
<p>${reservasi.nama}</p>
</div>

<div class="info">
<span>💆 Treatment</span>
<p>${reservasi.treatment}</p>
</div>

<div class="info">
<span>💰 Harga</span>
<p>${reservasi.harga}</p>
</div>

<div class="info">
<span>👩 Terapis</span>
<p>${reservasi.terapis}</p>
</div>

<div class="info">
<span>📅 Tanggal Reservasi</span>
<p>${reservasi.tanggal}</p>
</div>

<div class="info">
<span>🕒 Jam Reservasi</span>
<p>${reservasi.jam}</p>
</div>

<div class="info">
<span>📌 Status</span>
<p class="status">${reservasi.status}</p>
</div>

<a href="index.html" class="btn-kembali">
🏠 Kembali ke Beranda
</a>

</div>

`;

}else{

document.getElementById("hasil").innerHTML = `

<div class="hasil-card">

<h2>❌ Data Reservasi Tidak Ditemukan</h2>

<p style="text-align:center;margin-top:20px;">
Silakan lakukan reservasi terlebih dahulu.
</p>

<a href="reservasi.html" class="btn-kembali">
📝 Buat Reservasi
</a>

</div>

`;

}

</script>
