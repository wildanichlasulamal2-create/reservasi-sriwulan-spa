<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cek Reservasi | SIRES Sriwulan Spa</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<section class="booking">

<div class="booking-box">

<h1>🌸 Cek Status Reservasi</h1>

<p>Informasi reservasi pelanggan</p>

<div id="hasil"></div>

</div>

</section>

<script>

let data = JSON.parse(localStorage.getItem("reservasi"));

if(data){

document.getElementById("hasil").innerHTML = `

<div class="hasil-card">

<h2>✅ Reservasi Berhasil</h2>

<div class="info">
<span>🔖 Nomor Booking</span>
<h3>${data.booking}</h3>
</div>

<div class="info">
<span>👤 Nama Pelanggan</span>
<p>${data.nama}</p>
</div>

<div class="info">
<span>💆 Treatment</span>
<p>${data.treatment}</p>
</div>

<div class="info">
<span>💰 Harga</span>
<p>${data.harga}</p>
</div>

<div class="info">
<span>👩 Terapis</span>
<p>${data.terapis}</p>
</div>

<div class="info">
<span>📅 Tanggal Reservasi</span>
<p>${data.tanggal}</p>
</div>

<div class="info">
<span>🕒 Jam Reservasi</span>
<p>${data.jam}</p>
</div>

<div class="info">
<span>📌 Status</span>
<p class="status">🟡 ${data.status}</p>
</div>

<a href="index.html" class="btn-kembali">
🏠 Kembali ke Beranda
</a>

</div>

`;

}else{

document.getElementById("hasil").innerHTML = `

<div class="hasil-card">

<h2>❌ Data Reservasi Tidak Ditemukan</h2>

<p style="text-align:center;margin-top:20px;">
Silakan lakukan reservasi terlebih dahulu.
</p>

<a href="reservasi.html" class="btn-kembali">
📝 Buat Reservasi
</a>

</div>

`;

}

</script>

</body>

</html>
