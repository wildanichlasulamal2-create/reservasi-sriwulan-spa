<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cek Reservasi | SIRES</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="form-container">


<h1>
Cek Status Reservasi
</h1>


<p>
Masukkan nomor booking Anda
</p>


<input 
type="text" 
id="inputBooking"
placeholder="Contoh: SPA483921">


<button onclick="cekReservasi()">
Cari
</button>


<div id="hasil"></div>


</div>



<script>


function cekReservasi(){


let input =
document.getElementById("inputBooking").value;



let booking =
localStorage.getItem("booking");



if(input == booking){


let nama =
localStorage.getItem("nama");


let treatment =
localStorage.getItem("treatment");


let tanggal =
localStorage.getItem("tanggal");


let jam =
localStorage.getItem("jam");


let terapis =
localStorage.getItem("terapis");



document.getElementById("hasil").innerHTML = `


<div class="card">


<h2>
${booking}
</h2>


<p>
<b>Nama</b>
<br>
${nama}
</p>


<p>
<b>Treatment</b>
<br>
${treatment}
</p>


<p>
<b>Status</b>
<br>
🟡 Menunggu Konfirmasi
</p>


<p>
<b>Tanggal</b>
<br>
${tanggal}
</p>


<p>
<b>Jam</b>
<br>
${jam}
</p>


<p>
<b>Terapis</b>
<br>
${terapis}
</p>


</div>


`;



}else{


document.getElementById("hasil").innerHTML = `


<p>
❌ Nomor booking tidak ditemukan
</p>


`;


}


}



</script>


</body>

</html>
